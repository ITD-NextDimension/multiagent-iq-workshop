<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5ff" />
  <title>AI Company</title>
  <link rel="stylesheet" href="styles.css?v=20260806-mobile" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2AA4F4" />
                <stop offset="1" stop-color="#1B6EF3" />
              </linearGradient>
              <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#7B68EE" />
                <stop offset="1" stop-color="#E3008C" />
              </linearGradient>
            </defs>
            <path d="M16 3c5 0 8 3 9 7-2-2-4-3-7-3-4 0-7 3-7 7 0 3 1 5 3 7-4-1-7-4-7-9 0-5 4-9 9-9z" fill="url(#g1)"/>
            <path d="M16 29c-5 0-8-3-9-7 2 2 4 3 7 3 4 0 7-3 7-7 0-3-1-5-3-7 4 1 7 4 7 9 0 5-4 9-9 9z" fill="url(#g2)"/>
          </svg>
        </span>
        <div class="brand-text">
          <strong>AI Company</strong>
          <small>AI-powered business assistant</small>
        </div>
      </div>
      <button class="new-chat" id="newChat" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- Messages -->
    <main class="chat" id="chat">
      <section class="welcome" id="welcome">
        <div class="welcome-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="56" height="56">
            <path d="M16 3c5 0 8 3 9 7-2-2-4-3-7-3-4 0-7 3-7 7 0 3 1 5 3 7-4-1-7-4-7-9 0-5 4-9 9-9z" fill="url(#g1)"/>
            <path d="M16 29c-5 0-8-3-9-7 2 2 4 3 7 3 4 0 7-3 7-7 0-3-1-5-3-7 4 1 7 4 7 9 0 5-4 9-9 9z" fill="url(#g2)"/>
          </svg>
        </div>
        <h1>Hi, I'm AI Company</h1>
        <p>Ask me about projects, bank accounts, tasks and their relationships. I answer from data and generate charts for you.</p>
        <div class="chips" id="chips">
          <button class="chip">What is the total budget by project status? Draw a bar chart.</button>
          <button class="chip">Which projects does the business account fund?</button>
          <button class="chip">Which tasks are under project PRJ-001?</button>
          <button class="chip">What entities and relationships are in the ontology?</button>
        </div>
      </section>
    </main>

    <!-- Composer -->
    <footer class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Message AI Company…" autocomplete="off"></textarea>
        <button id="send" class="send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
        </button>
      </div>
      <small class="hint">AI Company can make mistakes. Please verify important information.</small>
    </footer>
  </div>

  <script src="app.js?v=20260806-mobile"></script>
</body>
</html>
